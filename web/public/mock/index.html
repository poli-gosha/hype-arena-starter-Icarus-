<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAIN // Volumetric Topology Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #060608;
            --grain-bone: #f2f0ea;
            --grain-ice: #7dd3fc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            background-color: var(--bg-obsidian);
            color: var(--grain-bone);
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }

        /* Hide native scrollbar for pure canvas immersion */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Fixed WebGL Viewport */
        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* High-Frequency Post-Process Film Grain Canvas */
        #film-grain {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0.16;
        }

        /* Subtle Optical Vignette */
        .optical-vignette {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 48%, rgba(3, 3, 5, 0.82) 100%);
        }

        /* Invisible Scroll Track (600vh) */
        .scroll-proxy {
            position: relative;
            width: 100%;
            height: 600vh;
            z-index: 2;
        }

        /* Ultra-Minimal Dark Glass Settings Panel */
        .minimal-glass {
            background: rgba(10, 10, 14, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(242, 240, 234, 0.09);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
        }

        /* Precision Micro Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: rgba(242, 240, 234, 0.14);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f2f0ea;
            border: none;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.35);
            background: #7dd3fc;
        }

        .stage-dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: rgba(242, 240, 234, 0.22);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stage-dot.active {
            background: #f2f0ea;
            transform: scale(1.6);
            box-shadow: 0 0 10px rgba(242, 240, 234, 0.8);
        }
    </style>
</head>
<body>

    <!-- WebGL Point-Cloud & Filament Viewport -->
    <div id="webgl-container"></div>

    <!-- Optical Vignette -->
    <div class="optical-vignette"></div>

    <!-- High-Frequency Animated Film Grain Overlay -->
    <canvas id="film-grain"></canvas>

    <!-- Invisible Scroll Driver (600vh) -->
    <div class="scroll-proxy"></div>

    <!-- Minimal Right-Edge 2px Scroll Progress Line & Stage Dots -->
    <div class="fixed right-5 top-1/2 -translate-y-1/2 z-20 flex items-center gap-3">
        <div class="flex flex-col justify-between h-44 py-0.5">
            <button onclick="scrollToStage(0)" title="Stage 01: WWW Global Mesh" class="stage-dot active" data-dot="0"></button>
            <button onclick="scrollToStage(1)" title="Stage 02: Cerebral Cortex" class="stage-dot" data-dot="1"></button>
            <button onclick="scrollToStage(2)" title="Stage 03: Deep Neural Architecture" class="stage-dot" data-dot="2"></button>
            <button onclick="scrollToStage(3)" title="Stage 04: Toroidal Singularity" class="stage-dot" data-dot="3"></button>
        </div>
        <div class="w-[2px] h-44 bg-white/10 relative overflow-hidden">
            <div id="scroll-line" class="w-full bg-[#f2f0ea] transition-none" style="height: 0%;"></div>
        </div>
    </div>

    <!-- Minimal Collapsible Grain Settings Menu (Bottom-Right) -->
    <aside class="fixed bottom-5 right-5 z-30 w-64 text-[10px] tracking-wider uppercase">
        <div class="minimal-glass rounded-lg overflow-hidden transition-all duration-300">
            <!-- Header Bar -->
            <button id="menu-toggle" class="w-full px-3.5 py-2.5 flex items-center justify-between text-[#f2f0ea]/90 hover:text-white transition border-b border-white/5">
                <span class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#f2f0ea] animate-pulse"></span>
                    <span>GRAIN // PARAMS</span>
                </span>
                <span id="menu-indicator" class="text-white/40 text-[9px]">[ - ]</span>
            </button>

            <!-- Collapsible Controls Body -->
            <div id="menu-body" class="p-3.5 space-y-3">
                <!-- Quick Stage Switcher Dots -->
                <div class="flex items-center justify-between pb-2 border-b border-white/5">
                    <span class="text-white/40">MORPH STATE</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="scrollToStage(0)" class="stage-pill px-1.5 py-0.5 rounded bg-white/10 text-white hover:bg-white/20 transition text-[9px]" data-pill="0">01</button>
                        <button onclick="scrollToStage(1)" class="stage-pill px-1.5 py-0.5 rounded bg-white/5 text-white/40 hover:bg-white/20 transition text-[9px]" data-pill="1">02</button>
                        <button onclick="scrollToStage(2)" class="stage-pill px-1.5 py-0.5 rounded bg-white/5 text-white/40 hover:bg-white/20 transition text-[9px]" data-pill="2">03</button>
                        <button onclick="scrollToStage(3)" class="stage-pill px-1.5 py-0.5 rounded bg-white/5 text-white/40 hover:bg-white/20 transition text-[9px]" data-pill="3">04</button>
                    </div>
                </div>

                <!-- 1. Grain Intensity -->
                <div class="space-y-1">
                    <div class="flex justify-between text-white/60">
                        <span>GRAIN INTENSITY</span>
                        <span id="lbl-grain" class="text-[#f2f0ea]">0.65</span>
                    </div>
                    <input type="range" id="ctrl-grain" min="0" max="100" value="65">
                </div>

                <!-- 2. Particle Density -->
                <div class="space-y-1">
                    <div class="flex justify-between text-white/60">
                        <span>PARTICLE DENSITY</span>
                        <span id="lbl-density" class="text-[#f2f0ea]">100%</span>
                    </div>
                    <input type="range" id="ctrl-density" min="15" max="100" value="100">
                </div>

                <!-- 3. Point Size -->
                <div class="space-y-1">
                    <div class="flex justify-between text-white/60">
                        <span>POINT SIZE</span>
                        <span id="lbl-size" class="text-[#f2f0ea]">1.35</span>
                    </div>
                    <input type="range" id="ctrl-size" min="40" max="280" value="135">
                </div>

                <!-- 4. Dispersion / Curl -->
                <div class="space-y-1">
                    <div class="flex justify-between text-white/60">
                        <span>DISPERSION / CURL</span>
                        <span id="lbl-curl" class="text-[#f2f0ea]">0.55</span>
                    </div>
                    <input type="range" id="ctrl-curl" min="0" max="150" value="55">
                </div>

                <!-- 5. Synapse Glow -->
                <div class="space-y-1">
                    <div class="flex justify-between text-white/60">
                        <span>SYNAPSE GLOW</span>
                        <span id="lbl-glow" class="text-[#f2f0ea]">0.75</span>
                    </div>
                    <input type="range" id="ctrl-glow" min="0" max="100" value="75">
                </div>
            </div>
        </div>
    </aside>

    <script>
        /* ============================================================================
           VOLUMETRIC STIPPLE-GRAIN & NEURAL TOPOLOGY WEBGL ENGINE
           Inspired by ingrassiadaniel.it — 45,000 Custom GLSL Particles + Filaments
           ============================================================================ */

        const PARTICLE_COUNT = 45000;
        const FILAMENT_SEGMENTS = 3600; // 7200 vertices for fine glowing connections

        // Scroll & Velocity State
        let targetScroll = 0;       // 0.0 -> 3.0 across 4 stages
        let smoothScroll = 0;
        let scrollVelocity = 0;
        let prevSmoothScroll = 0;

        // Mouse & 3D Raycast State
        const mouse = {
            ndcX: 0,
            ndcY: 0,
            smoothX: 0,
            smoothY: 0,
            worldPos: new THREE.Vector3(0, 0, 9999)
        };

        /* ============================================================================
           1. DETERMINISTIC PSEUDO-RANDOM & NOISE HELPERS FOR GEOMETRY SCULPTING
           ============================================================================ */
        function hash(n) {
            return ((Math.sin(n) * 43758.5453123) % 1 + 1) % 1;
        }

        function noise3D(x, y, z) {
            const pX = Math.floor(x), pY = Math.floor(y), pZ = Math.floor(z);
            const fX = x - pX, fY = y - pY, fZ = z - pZ;
            const uX = fX * fX * (3 - 2 * fX);
            const uY = fY * fY * (3 - 2 * fY);
            const uZ = fZ * fZ * (3 - 2 * fZ);
            const n = pX + pY * 57 + 113 * pZ;
            const a = lerp(hash(n), hash(n + 1), uX);
            const b = lerp(hash(n + 57), hash(n + 58), uX);
            const c = lerp(hash(n + 113), hash(n + 114), uX);
            const d = lerp(hash(n + 170), hash(n + 171), uX);
            return lerp(lerp(a, b, uY), lerp(c, d, uY), uZ);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        /* ============================================================================
           2. HIGH-DEFINITION 3D TOPOLOGY GENERATORS (45,000 POINTS EACH)
           ============================================================================ */

        // Major Global Hub Coordinates (Lat, Lon in degrees) for Submarine Cable Arcs
        const GLOBAL_HUBS = [
            [40.71, -74.00], [51.50, -0.12], [35.67, 139.65], [1.35, 103.81],
            [37.77, -122.41], [-33.86, 151.20], [-23.55, -46.63], [48.85, 2.35],
            [22.31, 114.16], [19.07, 72.87], [55.75, 37.61], [30.04, 31.23],
            [-34.60, -58.38], [34.05, -118.24], [50.11, 8.68], [31.23, 121.47]
        ];

        function latLonToVec3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function buildTopologies() {
            const posStage0 = new Float32Array(PARTICLE_COUNT * 3); // WWW Global Network Sphere
            const posStage1 = new Float32Array(PARTICLE_COUNT * 3); // 3D Cerebral Neural Cortex
            const posStage2 = new Float32Array(PARTICLE_COUNT * 3); // Deep Neural Network MLP/Transformer
            const posStage3 = new Float32Array(PARTICLE_COUNT * 3); // Toroidal Singularity & Wave Field

            const aSeed = new Float32Array(PARTICLE_COUNT);
            const aType = new Float32Array(PARTICLE_COUNT); // 0 = fine dust, 0.5 = contour ridge, 1.0 = bright hub/pulse

            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            const R_GLOBE = 155;

            // Precompute 3D Hub vectors for Stage 0 arcs
            const hubVecs = GLOBAL_HUBS.map(([lat, lon]) => latLonToVec3(lat, lon, R_GLOBE));

            // Precompute MLP Layer Node Centers for Stage 2 so weight beams connect exact nodes
            const mlpLayers = 5;
            const mlpLayerX = [-210, -105, 0, 105, 210];
            const mlpNodesPerLayer = [36, 64, 81, 64, 36];
            const mlpCenters = [];

            for (let l = 0; l < mlpLayers; l++) {
                const countL = mlpNodesPerLayer[l];
                const colsL = Math.sqrt(countL);
                const spacing = l === 2 ? 26 : (l === 1 || l === 3 ? 28 : 32);
                const layerList = [];
                for (let k = 0; k < countL; k++) {
                    const r = Math.floor(k / colsL) - (colsL - 1) / 2;
                    const c = (k % colsL) - (colsL - 1) / 2;
                    // Slight cylindrical curvature to each tensor plane
                    const y = r * spacing;
                    const z = c * spacing;
                    const xOffset = (y * y + z * z) * 0.0008 * (l - 2);
                    layerList.push(new THREE.Vector3(mlpLayerX[l] + xOffset, y, z));
                }
                mlpCenters.push(layerList);
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const u = i / PARTICLE_COUNT;
                aSeed[i] = Math.random();

                let particleRole = 0.25; // Default stipple grain

                /* ====================================================================
                   STAGE 0: WWW GLOBAL NETWORK SPHERE
                   (Geodesic Lat/Lon Grid + Continental Stipple + Submarine Cable Arcs + Orbital Rings)
                   ==================================================================== */
                if (i < PARTICLE_COUNT * 0.28) {
                    // 1. Sharp Geodesic Latitude & Longitude Grid Rings
                    const isLat = (i % 2 === 0);
                    if (isLat) {
                        const ringIdx = (i % 18) - 8.5;
                        const latAngle = (ringIdx / 9.5) * (Math.PI * 0.48);
                        const lonAngle = (i * 0.137) % (Math.PI * 2);
                        const rRing = Math.cos(latAngle) * R_GLOBE;
                        posStage0[i3]     = Math.cos(lonAngle) * rRing;
                        posStage0[i3 + 1] = Math.sin(latAngle) * R_GLOBE;
                        posStage0[i3 + 2] = Math.sin(lonAngle) * rRing;
                    } else {
                        const meridianIdx = i % 24;
                        const lonAngle = (meridianIdx / 24) * Math.PI * 2;
                        const latAngle = ((i * 0.071) % 1 - 0.5) * Math.PI;
                        const rRing = Math.cos(latAngle) * R_GLOBE;
                        posStage0[i3]     = Math.cos(lonAngle) * rRing;
                        posStage0[i3 + 1] = Math.sin(latAngle) * R_GLOBE;
                        posStage0[i3 + 2] = Math.sin(lonAngle) * rRing;
                    }
                    particleRole = 0.55;
                } else if (i < PARTICLE_COUNT * 0.72) {
                    // 2. Dense Continental Landmass Stipple Shell (Filtered via 3D Multi-Octave Noise)
                    let px, py, pz, landVal;
                    let attempt = 0;
                    let idxSeed = i;
                    do {
                        const yNorm = 1 - ((idxSeed * 1.6180339) % 1) * 2;
                        const rSlice = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
                        const theta = idxSeed * 2.3999632;
                        px = Math.cos(theta) * rSlice;
                        py = yNorm;
                        pz = Math.sin(theta) * rSlice;
                        // Continental harmonic mask
                        landVal = noise3D(px * 2.6 + 1.4, py * 2.6 + 0.7, pz * 2.6 + 2.1) * 0.65 +
                                  noise3D(px * 6.5, py * 6.5, pz * 6.5) * 0.35;
                        idxSeed += 73;
                        attempt++;
                    } while (landVal < 0.49 && attempt < 6);

                    // Elevate continental shelves slightly above ocean grid
                    const elev = R_GLOBE + (landVal > 0.58 ? 2.5 : 0.6);
                    posStage0[i3]     = px * elev;
                    posStage0[i3 + 1] = py * elev;
                    posStage0[i3 + 2] = pz * elev;
                    particleRole = landVal > 0.62 ? 0.85 : 0.35;
                } else if (i < PARTICLE_COUNT * 0.88) {
                    // 3. Elevated Submarine / Optical Routing Arcs between Global City Hubs
                    const pairIdx = i % 36;
                    const hubA = hubVecs[pairIdx % hubVecs.length];
                    const hubB = hubVecs[(pairIdx * 3 + 5) % hubVecs.length];
                    const tArc = (i * 0.0193) % 1;
                    const interp = new THREE.Vector3().lerpVectors(hubA, hubB, tArc).normalize();
                    const arcAltitude = R_GLOBE + Math.sin(tArc * Math.PI) * 34;
                    posStage0[i3]     = interp.x * arcAltitude + (Math.random() - 0.5) * 1.5;
                    posStage0[i3 + 1] = interp.y * arcAltitude + (Math.random() - 0.5) * 1.5;
                    posStage0[i3 + 2] = interp.z * arcAltitude + (Math.random() - 0.5) * 1.5;
                    particleRole = (tArc < 0.06 || tArc > 0.94) ? 1.0 : 0.75;
                } else {
                    // 4. Equatorial & Polar Telemetry Satellite Rings
                    const ringChoice = i % 3;
                    const ang = (i * 0.043) % (Math.PI * 2);
                    const ringR = R_GLOBE + 44 + ringChoice * 16 + (Math.random() - 0.5) * 4;
                    let rx = Math.cos(ang) * ringR;
                    let ry = (Math.random() - 0.5) * 3.0;
                    let rz = Math.sin(ang) * ringR;
                    // Tilt each orbital ring distinctly
                    const tilt = ringChoice === 0 ? 0.38 : (ringChoice === 1 ? -0.52 : 1.15);
                    const cT = Math.cos(tilt), sT = Math.sin(tilt);
                    posStage0[i3]     = rx;
                    posStage0[i3 + 1] = ry * cT - rz * sT;
                    posStage0[i3 + 2] = ry * sT + rz * cT;
                    particleRole = (i % 12 === 0) ? 1.0 : 0.45;
                }

                /* ====================================================================
                   STAGE 1: 3D CEREBRAL NEURAL CORTEX (BILATERAL SYNAPTIC BRAIN)
                   (Folded Gyri/Sulci Hemispheres + Corpus Callosum Bridge + Brainstem Tracts)
                   ==================================================================== */
                if (i < PARTICLE_COUNT * 0.76) {
                    // Bilateral Cerebral Hemispheres with Sculpted Lobes & Gyri Ridges
                    const hemi = (i % 2 === 0) ? 1 : -1;
                    // Sample spherical angles
                    const uB = Math.acos(1 - 2 * ((i * 0.6180339) % 1)); // 0 to PI (anterior to posterior)
                    const vB = ((i * 0.381966) % 1) * Math.PI;           // 0 to PI (medial to lateral dome)

                    // Base anatomical proportions: AP (Z), DV (Y), ML (X)
                    const sinU = Math.sin(uB), cosU = Math.cos(uB);
                    const sinV = Math.sin(vB), cosV = Math.cos(vB);

                    // Carve Frontal, Parietal, Occipital, and Temporal Lobe silhouettes
                    let xBase = sinU * sinV * 96;
                    let yBase = sinU * cosV * 108;
                    let zBase = cosU * 148;

                    // Flatten inferior base & bulge temporal lobe laterally
                    if (yBase < -25) {
                        yBase *= 0.62;
                        if (zBase > -35 && zBase < 55) {
                            xBase *= 1.18; // Temporal lobe lateral prominence
                            yBase -= 14;
                        }
                    }
                    // Frontal pole taper & occipital pole curvature
                    if (zBase > 40) {
                        xBase *= 0.92;
                    }

                    // High-frequency Cortical Gyri (ridges) and Sulci (grooves)
                    const gyriWave = Math.sin(zBase * 0.14 + Math.sin(yBase * 0.11) * 2.4) *
                                     Math.cos(yBase * 0.13 + Math.sin(xBase * 0.12) * 2.2);

                    // Concentrate particles along the crest of gyri ridges for razor-sharp brain contours
                    const ridgePull = 1.0 + gyriWave * 0.095;
                    const fissureGap = 11 + Math.max(0, (Math.abs(zBase) - 70) * 0.08);

                    posStage1[i3]     = hemi * (Math.abs(xBase) * ridgePull + fissureGap);
                    posStage1[i3 + 1] = yBase * ridgePull + 14;
                    posStage1[i3 + 2] = zBase * ridgePull;

                    if (gyriWave > 0.45) particleRole = Math.max(particleRole, 0.85);
                } else if (i < PARTICLE_COUNT * 0.90) {
                    // Dense Internal White-Matter Commissural Tracts (Corpus Callosum & Corona Radiata)
                    const tBridge = ((i * 0.113) % 1) * 2 - 1; // -1 (Left) to +1 (Right)
                    const zTract = (((i * 0.293) % 1) - 0.5) * 145;
                    const archHeight = Math.cos(tBridge * 1.35) * 38 + Math.cos(zTract * 0.018) * 18;
                    const spread = (Math.random() - 0.5) * 10;

                    posStage1[i3]     = tBridge * 78;
                    posStage1[i3 + 1] = archHeight - 8 + spread;
                    posStage1[i3 + 2] = zTract + spread;
                    particleRole = 0.75;
                } else {
                    // Cerebellum Foliations & Descending Brainstem Axon Columns
                    const isCerebellum = (i % 3 !== 0);
                    if (isCerebellum) {
                        const hemi = (i % 2 === 0) ? 1 : -1;
                        const uC = Math.acos(1 - 2 * ((i * 0.417) % 1));
                        const vC = ((i * 0.713) % 1) * Math.PI * 2;
                        const folia = 1 + 0.08 * Math.sin(uC * 18); // Fine horizontal cerebellar folia
                        posStage1[i3]     = hemi * (Math.abs(Math.sin(uC) * Math.cos(vC)) * 52 * folia + 6);
                        posStage1[i3 + 1] = Math.sin(uC) * Math.sin(vC) * 36 * folia - 62;
                        posStage1[i3 + 2] = Math.cos(uC) * 42 * folia - 88;
                    } else {
                        // Descending Brainstem / Corticospinal Fibers
                        const hStem = ((i * 0.083) % 1); // 0 to 1 downward
                        const angStem = (i * 0.51) % (Math.PI * 2);
                        const rStem = (1 - hStem * 0.35) * 22;
                        posStage1[i3]     = Math.cos(angStem) * rStem;
                        posStage1[i3 + 1] = -35 - hStem * 115;
                        posStage1[i3 + 2] = Math.sin(angStem) * rStem - 25 - hStem * 18;
                    }
                }

                /* ====================================================================
                   STAGE 2: DEEP NEURAL NETWORK ARCHITECTURE (MLP / TRANSFORMER DAG)
                   (5 Crisp Tensor Planes of Clustered Nodes + Dense Synaptic Weight Beams)
                   ==================================================================== */
                if (i < PARTICLE_COUNT * 0.48) {
                    // Crisp Node Micro-Spheres & Concentric Rings arranged in 5 3D Tensor Planes
                    const lIdx = i % mlpLayers;
                    const layerNodes = mlpCenters[lIdx];
                    const nodeCenter = layerNodes[i % layerNodes.length];

                    // Form tight spherical/ring shells around each neuron center
                    const subAngle1 = (i * 0.7548) % (Math.PI * 2);
                    const subAngle2 = Math.acos(1 - 2 * ((i * 0.3247) % 1));
                    const nodeRadius = (i % 4 === 0) ? 1.8 : 5.8;

                    posStage2[i3]     = nodeCenter.x + Math.sin(subAngle2) * Math.cos(subAngle1) * nodeRadius;
                    posStage2[i3 + 1] = nodeCenter.y + Math.sin(subAngle2) * Math.sin(subAngle1) * nodeRadius;
                    posStage2[i3 + 2] = nodeCenter.z + Math.cos(subAngle2) * nodeRadius;
                    particleRole = (nodeRadius < 2.5) ? 1.0 : 0.7;
                } else {
                    // Dense Directed Weight Filaments connecting Layer L -> Layer L+1
                    const lFrom = i % (mlpLayers - 1);
                    const listA = mlpCenters[lFrom];
                    const listB = mlpCenters[lFrom + 1];

                    const nodeA = listA[(i * 7) % listA.length];
                    const nodeB = listB[(i * 13 + 3) % listB.length];
                    const tBeam = (i * 0.0317) % 1;

                    posStage2[i3]     = lerp(nodeA.x, nodeB.x, tBeam);
                    posStage2[i3 + 1] = lerp(nodeA.y, nodeB.y, tBeam) + (Math.random() - 0.5) * 1.2;
                    posStage2[i3 + 2] = lerp(nodeA.z, nodeB.z, tBeam) + (Math.random() - 0.5) * 1.2;
                }

                /* ====================================================================
                   STAGE 3: TOROIDAL SINGULARITY & CYBERNETIC WAVE FIELD
                   (Intertwined Torus-Knot Accretion Core + Topological Horizon Grid)
                   ==================================================================== */
                if (i < PARTICLE_COUNT * 0.58) {
                    // Dense (p=3, q=5) Torus-Knot & Fluted Accretion Vortex
                    const tKnot = (i / (PARTICLE_COUNT * 0.58)) * Math.PI * 2 * 5;
                    const pK = 3, qK = 5;
                    const rCore = 115 + 42 * Math.cos(qK * tKnot / pK);
                    const kx = rCore * Math.cos(tKnot);
                    const ky = 42 * Math.sin(qK * tKnot / pK);
                    const kz = rCore * Math.sin(tKnot);

                    // Tube cross-section with spiral ridges
                    const tubeAngle = (i * 0.618) * Math.PI * 2;
                    const tubeRadius = 18 + 6 * Math.sin(tubeAngle * 4 + tKnot * 2);
                    posStage3[i3]     = kx + Math.cos(tubeAngle) * tubeRadius;
                    posStage3[i3 + 1] = ky + Math.sin(tubeAngle) * tubeRadius;
                    posStage3[i3 + 2] = kz + Math.sin(tubeAngle + 1.2) * tubeRadius;
                    particleRole = (i % 9 === 0) ? 0.95 : 0.55;
                } else {
                    // Surrounding Infinite Cybernetic Wave Horizon Ribbon
                    const idxWave = i - Math.floor(PARTICLE_COUNT * 0.58);
                    const totalWave = PARTICLE_COUNT - Math.floor(PARTICLE_COUNT * 0.58);
                    const colsW = 160;
                    const rowsW = Math.ceil(totalWave / colsW);
                    const cW = idxWave % colsW;
                    const rW = Math.floor(idxWave / colsW);

                    const wx = ((cW / (colsW - 1)) - 0.5) * 560;
                    const wz = ((rW / (rowsW - 1)) - 0.5) * 440;
                    const distCenter = Math.sqrt(wx * wx + wz * wz);
                    const wy = Math.sin(distCenter * 0.045) * 28 - 95;

                    posStage3[i3]     = wx;
                    posStage3[i3 + 1] = wy;
                    posStage3[i3 + 2] = wz;
                }

                aType[i] = particleRole;
            }

            return { posStage0, posStage1, posStage2, posStage3, aSeed, aType };
        }

        /* ============================================================================
           3. CUSTOM GLSL VERTEX & FRAGMENT SHADERS (MORPHING + CURL TURBULENCE + STIPPLE)
           ============================================================================ */
        const particleVertexShader = `
            uniform float uTime;
            uniform float uScroll;          // Continuous 0.0 -> 3.0
            uniform float uVelocity;        // Scroll speed spike for organic sand dispersion
            uniform float uPointSize;
            uniform float uGrainIntensity;
            uniform float uCurlStrength;
            uniform float uDensityCutoff;
            uniform float uSynapseGlow;
            uniform vec3 uMouseWorld;

            attribute vec3 aPos1;
            attribute vec3 aPos2;
            attribute vec3 aPos3;
            attribute float aSeed;
            attribute float aType;

            varying float vAlpha;
            varying float vType;
            varying float vSeed;
            varying float vPulse;

            // Fast 3D Simplex-style Sinusoidal Curl Field for Sand/Grain Dispersion
            vec3 curlField(vec3 p, float t) {
                vec3 q = p * 0.016 + vec3(t * 0.45, -t * 0.35, t * 0.25);
                float nx = sin(q.y * 2.1 + cos(q.z * 1.9 + t)) * cos(q.x * 1.7);
                float ny = sin(q.z * 2.3 + cos(q.x * 2.1 - t)) * cos(q.y * 1.5);
                float nz = sin(q.x * 1.9 + cos(q.y * 2.5 + t)) * cos(q.z * 1.8);
                return vec3(nx, ny, nz);
            }

            float cubicSmooth(float x) {
                return x * x * (3.0 - 2.0 * x);
            }

            void main() {
                vSeed = aSeed;
                vType = aType;

                // Density culling controlled by HUD slider
                if (aSeed > uDensityCutoff) {
                    gl_Position = vec4(2.0, 2.0, 2.0, 0.0);
                    gl_PointSize = 0.0;
                    return;
                }

                // Subtle idle animations per topology before blending
                vec3 p0 = position; // Stage 0: WWW Sphere
                vec3 p1 = aPos1;    // Stage 1: Cerebral Brain
                vec3 p2 = aPos2;    // Stage 2: Neural MLP
                vec3 p3 = aPos3;    // Stage 3: Toroidal Singularity

                // Stage 0 slow axial rotation
                float ang0 = uTime * 0.18;
                float c0 = cos(ang0), s0 = sin(ang0);
                p0 = vec3(p0.x * c0 - p0.z * s0, p0.y, p0.x * s0 + p0.z * c0);

                // Stage 1 subtle cortical gyri breathing
                float brainPulse = 1.0 + sin(uTime * 2.2 - length(p1) * 0.025) * 0.022;
                p1 *= brainPulse;

                // Stage 2 forward-propagation wave along X-axis
                p2.y += sin(uTime * 1.8 + p2.x * 0.02) * 3.0;

                // Stage 3 toroidal vortex rotation & horizon undulation
                float ang3 = uTime * 0.28;
                float c3 = cos(ang3), s3 = sin(ang3);
                if (p3.y > -55.0) {
                    p3 = vec3(p3.x * c3 - p3.z * s3, p3.y, p3.x * s3 + p3.z * c3);
                } else {
                    float dWave = length(p3.xz);
                    p3.y = sin(dWave * 0.045 - uTime * 2.4) * 24.0 - 95.0;
                }

                // Interpolate smoothly across the 4 stages based on uScroll (0..3)
                vec3 morphedPos;
                float transitionEnvelope = 0.0;

                if (uScroll < 1.0) {
                    float t = cubicSmooth(clamp(uScroll, 0.0, 1.0));
                    morphedPos = mix(p0, p1, t);
                    transitionEnvelope = sin(t * 3.14159265);
                } else if (uScroll < 2.0) {
                    float t = cubicSmooth(clamp(uScroll - 1.0, 0.0, 1.0));
                    morphedPos = mix(p1, p2, t);
                    transitionEnvelope = sin(t * 3.14159265);
                } else {
                    float t = cubicSmooth(clamp(uScroll - 2.0, 0.0, 1.0));
                    morphedPos = mix(p2, p3, t);
                    transitionEnvelope = sin(t * 3.14159265);
                }

                // Ingrassia-style Curl Turbulence during morph transitions & scroll velocity spikes
                float turbulenceAmt = (transitionEnvelope * 36.0 + clamp(uVelocity * 55.0, 0.0, 48.0)) * uCurlStrength;
                vec3 curlOffset = curlField(morphedPos + aSeed * 18.0, uTime * 1.4);
                morphedPos += curlOffset * turbulenceAmt;

                // High-frequency tactile micro-grain jitter
                vec3 grainJitter = vec3(
                    sin(uTime * 28.0 + aSeed * 628.0),
                    cos(uTime * 24.0 + aSeed * 412.0),
                    sin(uTime * 31.0 + aSeed * 819.0)
                ) * (uGrainIntensity * 1.35);
                morphedPos += grainJitter;

                // Localized 3D Magnetic Repulsion / Swirl Sphere around Cursor
                vec3 toMouse = morphedPos - uMouseWorld;
                float distMouse = length(toMouse);
                float repelRadius = 85.0;
                if (distMouse < repelRadius && distMouse > 0.001) {
                    float f = pow(1.0 - distMouse / repelRadius, 2.0);
                    vec3 tangent = normalize(cross(toMouse, vec3(0.0, 1.0, 0.0)));
                    morphedPos += (normalize(toMouse) * 28.0 + tangent * 18.0) * f;
                }

                // Travelling Synaptic / Packet Activation Wave
                float waveCoord = (morphedPos.x + morphedPos.y * 0.5 + morphedPos.z * 0.5) * 0.018 - uTime * 2.2;
                float synapticFire = pow(max(0.0, sin(waveCoord + aSeed * 2.5)), 8.0) * uSynapseGlow;
                vPulse = synapticFire;

                vec4 mvPosition = modelViewMatrix * vec4(morphedPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                // Perspective-attenuated crisp point size
                float depthScale = 360.0 / max(80.0, -mvPosition.z);
                float roleScale = mix(0.85, 1.75, aType) + synapticFire * 1.15;
                gl_PointSize = clamp(uPointSize * depthScale * roleScale, 0.8, 7.5);

                // Depth + Stipple Shading Alpha
                float depthFade = smoothstep(680.0, 180.0, -mvPosition.z);
                float stippleFlicker = 1.0 - (uGrainIntensity * 0.35 * fract(sin(dot(morphedPos.xy, vec2(12.9898, 78.233)) + uTime * 6.0) * 43758.5453));
                vAlpha = clamp(depthFade * stippleFlicker * (0.42 + aType * 0.45 + synapticFire * 0.4), 0.05, 1.0);
            }
        `;

        const particleFragmentShader = `
            varying float vAlpha;
            varying float vType;
            varying float vSeed;
            varying float vPulse;

            void main() {
                // Crisp circular micro-dot with soft anti-aliased edge
                vec2 uv = gl_PointCoord - vec2(0.5);
                float distSq = dot(uv, uv);
                if (distSq > 0.25) discard;

                float core = smoothstep(0.25, 0.04, distSq);

                // Editorial Monochrome Bone (#f2f0ea) + Cool Ice-Cyan Synaptic Highlights (#7dd3fc)
                vec3 boneWhite = vec3(0.949, 0.941, 0.918);
                vec3 silverMid = vec3(0.68, 0.71, 0.76);
                vec3 iceCyan   = vec3(0.490, 0.827, 0.988);

                vec3 baseCol = mix(silverMid, boneWhite, vType);
                vec3 finalCol = mix(baseCol, iceCyan, clamp(vPulse * 0.85 + (vType > 0.8 ? 0.25 : 0.0), 0.0, 1.0));

                gl_FragColor = vec4(finalCol, vAlpha * core);
            }
        `;

        /* ============================================================================
           4. THREE.JS SCENE, CAMERA, POINT-CLOUD & SYNAPTIC FILAMENT INITIALIZATION
           ============================================================================ */
        let scene, camera, renderer, particleSystem, filamentSystem;
        let uniforms;

        function initWebGL() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 10, 1500);
            camera.position.set(0, 0, 440);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x060608, 1);
            container.appendChild(renderer.domElement);

            // Generate 45,000 Volumetric Morph Coordinates
            const { posStage0, posStage1, posStage2, posStage3, aSeed, aType } = buildTopologies();

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(posStage0, 3));
            geometry.setAttribute('aPos1', new THREE.BufferAttribute(posStage1, 3));
            geometry.setAttribute('aPos2', new THREE.BufferAttribute(posStage2, 3));
            geometry.setAttribute('aPos3', new THREE.BufferAttribute(posStage3, 3));
            geometry.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
            geometry.setAttribute('aType', new THREE.BufferAttribute(aType, 1));

            uniforms = {
                uTime: { value: 0 },
                uScroll: { value: 0 },
                uVelocity: { value: 0 },
                uPointSize: { value: 1.35 * Math.min(window.devicePixelRatio, 2) },
                uGrainIntensity: { value: 0.65 },
                uCurlStrength: { value: 0.55 },
                uDensityCutoff: { value: 1.0 },
                uSynapseGlow: { value: 0.75 },
                uMouseWorld: { value: new THREE.Vector3(0, 0, 9999) }
            };

            const material = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                uniforms: uniforms,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Build Fine Synaptic Filament Mesh (Shares exact morphing vertex logic for locked sync)
            buildSynapticFilaments(posStage0, posStage1, posStage2, posStage3, aSeed);
        }

        function buildSynapticFilaments(p0, p1, p2, p3, seeds) {
            const vertCount = FILAMENT_SEGMENTS * 2;
            const fPos0 = new Float32Array(vertCount * 3);
            const fPos1 = new Float32Array(vertCount * 3);
            const fPos2 = new Float32Array(vertCount * 3);
            const fPos3 = new Float32Array(vertCount * 3);
            const fSeed = new Float32Array(vertCount);
            const fType = new Float32Array(vertCount);

            // Connect nearby index pairs so filaments trace geodesic rings, brain tracts, MLP beams & knot curves
            for (let s = 0; s < FILAMENT_SEGMENTS; s++) {
                const idxA = (s * 12) % PARTICLE_COUNT;
                // Choose neighbor in same structural block
                const idxB = idxA + 1;

                const v0 = s * 6;
                const v1 = s * 6 + 3;
                const a3 = idxA * 3;
                const b3 = idxB * 3;

                // Only form filament if segment isn't wildly stretched across space
                const dx1 = p1[a3] - p1[b3], dy1 = p1[a3+1] - p1[b3+1], dz1 = p1[a3+2] - p1[b3+2];
                const dist1Sq = dx1*dx1 + dy1*dy1 + dz1*dz1;

                if (dist1Sq < 2600) {
                    for (let k = 0; k < 3; k++) {
                        fPos0[v0 + k] = p0[a3 + k]; fPos0[v1 + k] = p0[b3 + k];
                        fPos1[v0 + k] = p1[a3 + k]; fPos1[v1 + k] = p1[b3 + k];
                        fPos2[v0 + k] = p2[a3 + k]; fPos2[v1 + k] = p2[b3 + k];
                        fPos3[v0 + k] = p3[a3 + k]; fPos3[v1 + k] = p3[b3 + k];
                    }
                }

                fSeed[s * 2] = seeds[idxA];
                fSeed[s * 2 + 1] = seeds[idxB];
                fType[s * 2] = 0.15;
                fType[s * 2 + 1] = 0.15;
            }

            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(fPos0, 3));
            lineGeo.setAttribute('aPos1', new THREE.BufferAttribute(fPos1, 3));
            lineGeo.setAttribute('aPos2', new THREE.BufferAttribute(fPos2, 3));
            lineGeo.setAttribute('aPos3', new THREE.BufferAttribute(fPos3, 3));
            lineGeo.setAttribute('aSeed', new THREE.BufferAttribute(fSeed, 1));
            lineGeo.setAttribute('aType', new THREE.BufferAttribute(fType, 1));

            const lineFragShader = `
                varying float vAlpha;
                varying float vPulse;
                uniform float uSynapseGlow;
                void main() {
                    vec3 col = mix(vec3(0.75, 0.78, 0.82), vec3(0.49, 0.83, 0.99), vPulse);
                    gl_FragColor = vec4(col, vAlpha * 0.16 * uSynapseGlow);
                }
            `;

            const lineMat = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: lineFragShader,
                uniforms: uniforms,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            filamentSystem = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(filamentSystem);
        }

        /* ============================================================================
           5. HIGH-FREQUENCY FILM GRAIN OVERLAY SYNTHESIZER
           ============================================================================ */
        const grainCanvas = document.getElementById('film-grain');
        const grainCtx = grainCanvas.getContext('2d');
        const tileW = 160, tileH = 160;
        const offTile = document.createElement('canvas');
        offTile.width = tileW;
        offTile.height = tileH;
        const offCtx = offTile.getContext('2d');
        const tileImg = offCtx.createImageData(tileW, tileH);

        function refreshGrainTile() {
            const buf = tileImg.data;
            for (let i = 0; i < buf.length; i += 4) {
                const v = (Math.random() * 255) | 0;
                buf[i] = v;
                buf[i + 1] = v;
                buf[i + 2] = v;
                buf[i + 3] = 255;
            }
            offCtx.putImageData(tileImg, 0, 0);
        }

        function renderFilmGrain(frame) {
            if (frame % 2 === 0) refreshGrainTile();
            grainCtx.clearRect(0, 0, grainCanvas.width, grainCanvas.height);
            const pat = grainCtx.createPattern(offTile, 'repeat');
            if (pat) {
                grainCtx.fillStyle = pat;
                grainCtx.save();
                const ox = (Math.random() * tileW) | 0;
                const oy = (Math.random() * tileH) | 0;
                grainCtx.translate(-ox, -oy);
                grainCtx.fillRect(0, 0, grainCanvas.width + tileW, grainCanvas.height + tileH);
                grainCtx.restore();
            }
        }

        /* ============================================================================
           6. MINIMAL UI & SCROLL INTERACTION HANDLERS
           ============================================================================ */
        function scrollToStage(stageIndex) {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const targetY = (stageIndex / 3) * maxScroll;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        }

        function updateMinimalUI(scrollVal) {
            const pct = Math.min(100, Math.max(0, (scrollVal / 3) * 100));
            document.getElementById('scroll-line').style.height = `${pct}%`;

            const activeIdx = Math.min(3, Math.max(0, Math.round(scrollVal)));

            document.querySelectorAll('.stage-dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === activeIdx);
            });

            document.querySelectorAll('.stage-pill').forEach((pill, idx) => {
                if (idx === activeIdx) {
                    pill.className = 'stage-pill px-1.5 py-0.5 rounded bg-white/20 text-[#f2f0ea] transition text-[9px]';
                } else {
                    pill.className = 'stage-pill px-1.5 py-0.5 rounded bg-white/5 text-white/40 hover:bg-white/15 transition text-[9px]';
                }
            });
        }

        function initMinimalControls() {
            const toggleBtn = document.getElementById('menu-toggle');
            const menuBody = document.getElementById('menu-body');
            const indicator = document.getElementById('menu-indicator');
            let isOpen = true;

            toggleBtn.addEventListener('click', () => {
                isOpen = !isOpen;
                menuBody.classList.toggle('hidden', !isOpen);
                indicator.textContent = isOpen ? '[ - ]' : '[ + ]';
            });

            // 1. Grain Intensity
            document.getElementById('ctrl-grain').addEventListener('input', (e) => {
                const val = parseInt(e.target.value, 10) / 100;
                uniforms.uGrainIntensity.value = val;
                grainCanvas.style.opacity = (val * 0.24).toFixed(3);
                document.getElementById('lbl-grain').textContent = val.toFixed(2);
            });

            // 2. Particle Density
            document.getElementById('ctrl-density').addEventListener('input', (e) => {
                const pct = parseInt(e.target.value, 10);
                uniforms.uDensityCutoff.value = pct / 100;
                document.getElementById('lbl-density').textContent = `${pct}%`;
            });

            // 3. Point Size
            document.getElementById('ctrl-size').addEventListener('input', (e) => {
                const sz = parseInt(e.target.value, 10) / 100;
                uniforms.uPointSize.value = sz * Math.min(window.devicePixelRatio, 2);
                document.getElementById('lbl-size').textContent = sz.toFixed(2);
            });

            // 4. Dispersion / Curl
            document.getElementById('ctrl-curl').addEventListener('input', (e) => {
                const curl = parseInt(e.target.value, 10) / 100;
                uniforms.uCurlStrength.value = curl;
                document.getElementById('lbl-curl').textContent = curl.toFixed(2);
            });

            // 5. Synapse Glow
            document.getElementById('ctrl-glow').addEventListener('input', (e) => {
                const glow = parseInt(e.target.value, 10) / 100;
                uniforms.uSynapseGlow.value = glow;
                document.getElementById('lbl-glow').textContent = glow.toFixed(2);
            });
        }

        /* ============================================================================
           7. MAIN ANIMATION LOOP
           ============================================================================ */
        let frame = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            frame++;

            const t = now * 0.001;
            uniforms.uTime.value = t;

            // Smoothly damp scroll position & compute instantaneous scroll velocity for sand dispersion
            smoothScroll += (targetScroll - smoothScroll) * 0.065;
            const rawDelta = Math.abs(smoothScroll - prevSmoothScroll);
            prevSmoothScroll = smoothScroll;
            scrollVelocity += (rawDelta - scrollVelocity) * 0.12;

            uniforms.uScroll.value = smoothScroll;
            uniforms.uVelocity.value = scrollVelocity;

            updateMinimalUI(smoothScroll);

            // Smooth 3D Parallax Tilt from Cursor
            mouse.smoothX += (mouse.ndcX - mouse.smoothX) * 0.05;
            mouse.smoothY += (mouse.ndcY - mouse.smoothY) * 0.05;

            if (particleSystem && filamentSystem) {
                const rotY = mouse.smoothX * 0.42;
                const rotX = -mouse.smoothY * 0.32;
                particleSystem.rotation.y = rotY;
                particleSystem.rotation.x = rotX;
                filamentSystem.rotation.y = rotY;
                filamentSystem.rotation.x = rotX;
            }

            renderer.render(scene, camera);
            renderFilmGrain(frame);
        }

        /* ============================================================================
           8. EVENT LISTENERS
           ============================================================================ */
        function onScroll() {
            const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            const norm = Math.min(1, Math.max(0, window.scrollY / maxScroll));
            targetScroll = norm * 3.0;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            grainCanvas.width = window.innerWidth;
            grainCanvas.height = window.innerHeight;
        }

        function updateCursorWorld(clientX, clientY) {
            mouse.ndcX = (clientX / window.innerWidth) * 2 - 1;
            mouse.ndcY = -(clientY / window.innerHeight) * 2 + 1;

            // Project cursor onto Z=0 plane in 3D space for magnetic vortex interaction
            const vec = new THREE.Vector3(mouse.ndcX, mouse.ndcY, 0.5);
            vec.unproject(camera);
            const dir = vec.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            uniforms.uMouseWorld.value.copy(pos);
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onResize);
        window.addEventListener('mousemove', (e) => updateCursorWorld(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateCursorWorld(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        window.addEventListener('mouseleave', () => {
            uniforms.uMouseWorld.value.set(0, 0, 9999);
        });

        window.onload = () => {
            grainCanvas.width = window.innerWidth;
            grainCanvas.height = window.innerHeight;
            initWebGL();
            initMinimalControls();
            onScroll();
            requestAnimationFrame(animate);
        };
    </script>
