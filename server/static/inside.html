<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygraph · Inside the machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0C; --fg: #EDEDED; --mid: #9A9EA6; --low: #5A5E66; --line: rgba(255,255,255,.08);
    --lime: #D7F13B; --true: #7BD88F; --false: #FF6B7A; --unsure: #F5B85A;
    --head: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --bar: 60px;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--head); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; height: var(--bar); display: flex; align-items: center; gap: 28px; padding: 0 40px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .title { font-weight: 700; letter-spacing: -.01em; }
  .crumb { color: var(--low); margin-left: -16px; }
  .pick { display: flex; align-items: center; gap: 14px; margin-left: auto; min-width: 0; }
  .dd { position: relative; min-width: 0; }
  .dd-btn { display: flex; align-items: center; gap: 12px; max-width: 460px; min-width: 0; height: 38px; padding: 0 12px 0 14px;
    border: 1px solid var(--line); border-radius: 10px; color: var(--fg); transition: border-color .15s, background .15s; }
  .dd-btn:hover, .dd.open .dd-btn { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.03); }
  .dd-btn .n { font: 500 12px var(--mono); color: var(--lime); flex: none; }
  .dd-btn .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .dd-btn svg { flex: none; width: 10px; height: 6px; stroke: var(--mid); fill: none; stroke-width: 1.4; transition: transform .15s; }
  .dd.open .dd-btn svg { transform: rotate(180deg); }
  .dd-list { position: absolute; right: 0; top: calc(100% + 8px); width: min(560px, 92vw); max-height: min(560px, 70vh); overflow-y: auto;
    margin: 0; padding: 6px; list-style: none; background: #141416; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55); z-index: 30; }
  .dd-list[hidden] { display: none; }
  .dd-list .cap { font: 400 11.5px var(--mono); color: var(--low); padding: 8px 12px 10px; }
  .dd-list li[role="option"] { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 12px;
    border-radius: 8px; cursor: pointer; color: var(--mid); }
  .dd-list li .n { font: 400 12px var(--mono); color: var(--low); }
  .dd-list li .t { font-size: 14px; line-height: 1.45; }
  .dd-list li .d { font: 400 11.5px var(--mono); color: var(--low); white-space: nowrap; }
  .dd-list li.hl { background: rgba(255,255,255,.05); color: var(--fg); }
  .dd-list li[aria-selected="true"] { color: var(--fg); }
  .dd-list li[aria-selected="true"] .n { color: var(--lime); }
  .count { font: 400 12px var(--mono); color: var(--low); white-space: nowrap; }
  .arrows { display: flex; gap: 2px; }
  .arrows button { width: 30px; height: 30px; border-radius: 8px; color: var(--mid); }
  .arrows button:hover { color: var(--fg); background: rgba(255,255,255,.05); }
  .live { font-size: 14px; color: var(--mid); }
  .live:hover { color: var(--fg); }

  /* the two columns */
  .grid { display: grid; grid-template-columns: minmax(400px, 38%) minmax(0, 1fr); gap: 72px; max-width: 1480px; margin: 0 auto; padding: 0 40px; }
  .pipe { position: sticky; top: var(--bar); height: calc(100vh - var(--bar)); display: flex; align-items: center; justify-content: center; padding: 24px 0; }
  .pipe svg { width: 100%; height: 100%; overflow: visible; }
  .base { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 1.5; }
  .trace { fill: none; stroke: var(--lime); stroke-width: 2; stroke-dasharray: 1 2; stroke-dashoffset: 1; }
  .head { fill: var(--lime); opacity: 0; }
  .nd { cursor: pointer; }
  .nd .dot { fill: var(--bg); stroke: rgba(255,255,255,.28); stroke-width: 1.5; transition: fill .2s, stroke .2s; }
  .nd .ring { fill: none; stroke: var(--lime); stroke-width: 1; opacity: 0; }
  .nd .nm { font: 600 18px var(--head); fill: var(--low); transition: fill .2s; }
  .nd .sm { font: 400 12px var(--mono); fill: var(--mid); opacity: 0; transition: opacity .2s; }
  .nd.reached .dot { fill: var(--fg); stroke: var(--fg); }
  .nd.reached .nm { fill: var(--fg); }
  .nd.reached .sm { opacity: 1; }
  .nd.current .dot { fill: var(--lime); stroke: var(--lime); }
  .nd.current .ring { opacity: .35; }
  .nd:hover .nm { fill: var(--fg); }
  .wl { font: 400 11px var(--mono); fill: var(--low); letter-spacing: .04em; }

  /* the story on the right */
  .story { min-width: 0; max-width: 720px; padding-bottom: 45vh; }
  .intro { min-height: calc(100vh - var(--bar)); display: flex; flex-direction: column; justify-content: center; padding: 40px 0 12vh; }
  .meta { font: 400 13px var(--mono); color: var(--low); }
  h1 { font-size: clamp(32px, 3.3vw, 50px); line-height: 1.12; letter-spacing: -.02em; font-weight: 700; margin: 14px 0 28px; text-wrap: balance; }
  .hint { color: var(--mid); margin: 0; }
  .hint::after { content: " ↓"; }
  .step { min-height: 88vh; padding: 10vh 0 6vh; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .step.on { opacity: 1; pointer-events: auto; }
  .no { font: 400 13px var(--mono); color: var(--low); }
  h2 { font-size: 40px; line-height: 1.1; letter-spacing: -.02em; font-weight: 700; margin: 8px 0 16px; }
  .lede { font-size: 18px; color: var(--mid); margin: 0 0 14px; max-width: 60ch; }
  .io { font: 400 12.5px var(--mono); color: var(--low); margin: 0 0 40px; }
  .io b { color: var(--mid); font-weight: 400; }
  h3 { font-size: 15px; font-weight: 600; margin: 40px 0 12px; color: var(--fg); }
  h3:first-child { margin-top: 0; }
  h3 .st { font-weight: 500; margin-left: 10px; }
  .low { color: var(--low); } .mid { color: var(--mid); }
  .mono { font-family: var(--mono); }
  .lab { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .lab.true, .st.agrees { color: var(--true); } .lab.false, .st.invented { color: var(--false); } .lab.unsure, .st.stale, .st.premature { color: var(--unsure); }
  .st.unknown, .st.none { color: var(--mid); }
  p.text { color: var(--mid); margin: 16px 0 0; max-width: 62ch; }
  p.text b { color: var(--fg); font-weight: 500; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 13px 0; border-top: 1px solid var(--line); color: var(--mid); }
  .rows li:last-child { border-bottom: 1px solid var(--line); }
  .rows li.me { color: var(--fg); }
  .rows li.me::before { content: ""; align-self: stretch; width: 2px; margin: 0 -14px 0 0; background: var(--lime); flex: none; }
  .rows li em { font: 500 11px var(--mono); font-style: normal; text-transform: uppercase; letter-spacing: .06em; color: var(--low); white-space: nowrap; }
  .rows li .r { font-family: var(--mono); font-size: 13px; color: var(--fg); white-space: nowrap; }

  .quote { font-size: 22px; line-height: 1.6; color: var(--mid); margin: 0 0 36px; max-width: 34em; }
  .quote .s { color: var(--fg); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
  .quote .v { color: var(--lime); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .item { padding: 13px 0; border-top: 1px solid var(--line); }
  .item:last-child { border-bottom: 1px solid var(--line); }
  .item .k { color: var(--fg); }
  .item .d { display: block; font: 400 12px var(--mono); color: var(--low); margin-top: 3px; overflow-wrap: anywhere; }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th { text-align: left; font: 400 11.5px var(--mono); color: var(--low); padding: 0 0 10px; }
  td { padding: 11px 0; border-top: 1px solid var(--line); color: var(--mid); vertical-align: middle; }
  tr:last-child td { border-bottom: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-family: var(--mono); font-size: 13px; white-space: nowrap; padding-left: 18px; }
  tr.win td { color: var(--fg); }
  .bar2 { display: block; height: 2px; background: rgba(255,255,255,.07); min-width: 60px; }
  .bar2 i { display: block; height: 2px; background: var(--mid); }
  tr.win .bar2 i { background: var(--lime); }
  td.b { width: 26%; padding-left: 20px; }

  svg.tl { width: 100%; height: auto; display: block; margin: 4px 0 0; }
  .legend { font: 400 11.5px var(--mono); color: var(--low); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .legend i { font-style: normal; }

  .meter { position: relative; height: 70px; margin: 8px 0 12px; }
  .m-track { position: absolute; left: 0; right: 0; top: 34px; height: 1px;
    background: linear-gradient(90deg, rgba(123,216,143,.55) 0, rgba(123,216,143,.55) calc(var(--c) * 100%), rgba(255,107,122,.55) calc(var(--c) * 100%), rgba(255,107,122,.55) 100%); }
  .m-cut { position: absolute; left: calc(var(--c) * 100%); top: 25px; width: 1px; height: 19px; background: var(--mid); }
  .m-cut span, .m-end { position: absolute; top: -21px; font: 400 11.5px var(--mono); color: var(--low); white-space: nowrap; }
  .m-cut span { left: 50%; transform: translateX(-50%); }
  .m-end { top: 4px; } .m-end.r { right: 0; }
  .m-dot { position: absolute; left: calc(var(--p) * 100%); top: 29px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--lime); }
  .m-dot span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font: 500 12px var(--mono); color: var(--lime); white-space: nowrap; }
  .rule { font-size: 24px; line-height: 1.4; margin: 30px 0 6px; color: var(--fg); }
  .rule .mono { font-size: .82em; }
  .probs { display: flex; gap: 28px; flex-wrap: wrap; font: 400 13px var(--mono); color: var(--mid); margin: 6px 0 0; }
  dl.ev { display: grid; grid-template-columns: 1fr auto; margin: 0; }
  dl.ev dt, dl.ev dd { padding: 11px 0; border-top: 1px solid var(--line); margin: 0; }
  dl.ev dt { color: var(--mid); font-size: 14.5px; }
  dl.ev dd { font: 400 13px var(--mono); color: var(--fg); text-align: right; padding-left: 24px; }
  dl.ev dt:nth-last-child(2), dl.ev dd:last-child { border-bottom: 1px solid var(--line); }
  details { margin-top: 28px; }
  summary { cursor: pointer; color: var(--mid); font-size: 14px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+ "; font-family: var(--mono); color: var(--low); }
  details[open] summary::before { content: "− "; }
  summary:hover { color: var(--fg); }
  details dl.ev { margin-top: 14px; }

  pre.csv { font: 400 17px/1.8 var(--mono); color: var(--fg); margin: 0; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; }
  pre.csv .h { color: var(--low); }
  .same { color: var(--lime); }
  .diff { color: var(--false); }
  .foot { margin-top: 56px; font-size: 13px; color: var(--low); max-width: 62ch; }

  .mbar { display: none; }
  .empty { color: var(--mid); padding: 120px 40px; text-align: center; }

  @media (max-width: 960px) {
    .bar { position: static; height: auto; flex-wrap: wrap; gap: 10px 20px; padding: 14px 20px; }
    .pick { order: 3; flex-basis: 100%; margin-left: 0; gap: 10px; }
    .dd { flex: 1; } .dd-btn { max-width: none; width: 100%; }
    .dd-list { left: 0; right: auto; width: calc(100vw - 40px); }
    .count { display: none; }
    .live { margin-left: auto; }
    .grid { grid-template-columns: 1fr; gap: 0; padding: 0 20px; }
    .pipe { display: none; }
    .mbar { display: block; position: sticky; top: 0; z-index: 15; background: var(--bg); padding: 12px 0 0; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .mbar span { font: 400 12.5px var(--mono); color: var(--mid); }
    .mbar i { display: block; height: 1px; background: rgba(255,255,255,.13); margin-top: 10px; }
    .mbar b { display: block; height: 2px; margin-top: -.5px; background: var(--lime); width: 0; }
    .intro { min-height: 70vh; padding-bottom: 8vh; }
    h2 { font-size: 32px; }
    .cols { grid-template-columns: 1fr; gap: 28px; }
    .quote { font-size: 19px; }
    td.b { display: none; }
    .rule { font-size: 20px; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="title" href="/">Polygraph</a><span class="crumb">Inside the machine</span>
  <nav class="pick">
    <div class="dd" id="dd">
      <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddList">
        <span class="n" id="ddN">–</span><span class="t" id="ddT">Loading…</span><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4"/></svg></button>
      <ul class="dd-list" id="ddList" role="listbox" aria-label="Sample sentences" tabindex="-1" hidden></ul>
    </div>
    <span class="count" id="count"></span>
    <span class="arrows"><button id="prev" aria-label="Previous sentence">←</button><button id="next" aria-label="Next sentence">→</button></span>
  </nav>
  <a class="live" href="console.html">Live run</a>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = { agrees: "holds on this date", stale: "was true before this date, but not on it", premature: "only becomes true after this date",
  invented: "is never true on this timeline", unknown: "has no other evidence to compare with", none: "no fact found" };
const SHORT = { agrees: "holds", stale: "stale", premature: "premature", invented: "never true", unknown: "no evidence", none: "no fact" };

/* ---- the pipeline: the same data flow as polygraph/pipeline.py ---------------------------------
   Steps are what you scroll through; the linker and the reader are one step, as they run side
   by side on the same sentence. */
const VW = 460, VH = 830, X = 230;
const NODES = [
  { id: "input", name: "Input", step: 0, x: X, y: 60 },
  { id: "linker", name: "Linker", step: 1, x: 180, y: 200, side: "left" },
  { id: "reader", name: "Reader", step: 1, x: 280, y: 200, side: "right" },
  { id: "attributor", name: "Attributor", step: 2, x: X, y: 330 },
  { id: "kb", name: "Knowledge base", step: 3, x: X, y: 440 },
  { id: "truth", name: "Truth engine", step: 4, x: X, y: 550 },
  { id: "judge", name: "Judge", step: 5, x: X, y: 660 },
  { id: "writer", name: "Writer", step: 6, x: X, y: 770 },
];
const node = id => NODES.find(n => n.id === id);
// [from, to, traced while scrolling from step a to step b]
const WIRES = [["input", "linker", 0, 1], ["input", "reader", 0, 1], ["linker", "attributor", 1, 2], ["reader", "attributor", 1, 2],
  ["attributor", "kb", 2, 3], ["kb", "truth", 3, 4], ["truth", "judge", 4, 5], ["input", "judge", 0, 5, "page"], ["judge", "writer", 5, 6]];
const STEPS = 7;

let INDEX = [], TRACE = null, CURRENT = null, P = -1;

/* ---- values as people write them -------------------------------------------------------------- */
function val(v) {
  if (!v) return "";
  const n = x => typeof x === "number" ? x.toLocaleString("en-US") : x, cur = { EUR: "€", USD: "$", GBP: "£" };
  const op = v.op && v.op !== "eq" ? ({ gt: "over ", lt: "under ", ge: "at least ", le: "up to " }[v.op] || "") : "";
  const big = x => x >= 1e9 && Number.isInteger(x / 1e7) ? `${x / 1e9} billion` : x >= 1e6 && Number.isInteger(x / 1e4) ? `${x / 1e6} million` : n(x);
  if (v.kind === "money") return `${op}${cur[v.currency] || v.currency + " "}${big(v.value)}${v.per ? " per " + v.per : ""}`;
  if (v.kind === "quantity" || v.kind === "duration") return `${op}${n(v.value)} ${v.unit}`;
  if (v.kind === "percent") return `${op}${n(v.value)}%`;
  if (v.kind === "boolean") return v.value ? "yes" : "no";
  if (v.kind === "version") return `version ${v.value}`;
  return `${op}${v.value}`;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const attr = a => a.replace(/_/g, " ");
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
const lab = l => `<span class="lab ${l}">${l}</span>`;
const pct = x => `${Math.round(x * 100)}%`;
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const fact = f => `${esc(f.subject)} · ${esc(attr(f.attribute))}`;

/* ---- picking a sentence: the 20 sample rows of the last live run --------------------------------- */
async function loadIndex() {
  let j;
  try { j = await (await fetch("/api/trace/index")).json(); } catch (e) { $("#main").innerHTML = '<div class="empty">The server is not answering.</div>'; return; }
  INDEX = (j.rows || []).filter(r => r.traced && r.sample); TRACE = j.trace;
  if (!INDEX.length) {
    $("#ddT").textContent = "No sample sentences yet";
    $("#main").innerHTML = '<div class="empty">The last live run did not include the 20 sample sentences.<br>Run it again from <a href="console.html"><u>Live run</u></a> with the sample ticked.</div>';
    return;
  }
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  dropdown();
  const wanted = INDEX.find(r => r.id === new URLSearchParams(location.search).get("row"));
  open((wanted || INDEX[0]).id);
}
const no = i => String(i + 1).padStart(2, "0");
function dropdown() {
  const dd = $("#dd"), btn = $("#ddBtn"), list = $("#ddList");
  list.innerHTML = `<li class="cap" aria-hidden="true">${INDEX.length} sample sentences</li>` + INDEX.map((r, i) =>
    `<li role="option" id="o-${esc(r.id)}" data-id="${esc(r.id)}" aria-selected="false"><span class="n">${no(i)}</span><span class="t">${esc(r.text)}</span><span class="d">${esc(r.date)}</span></li>`).join("");
  const opts = () => $$("#ddList li[role=option]");
  let hl = -1;
  const mark = i => { hl = i; opts().forEach((o, k) => o.classList.toggle("hl", k === i)); if (opts()[i]) opts()[i].scrollIntoView({ block: "nearest" }); };
  const show = on => {
    list.hidden = !on; dd.classList.toggle("open", on); btn.setAttribute("aria-expanded", on);
    if (on) { mark(INDEX.findIndex(r => r.id === CURRENT)); list.focus(); }
  };
  btn.onclick = () => show(list.hidden);
  list.onclick = e => { const o = e.target.closest("li[role=option]"); if (o) { show(false); btn.focus(); open(o.dataset.id); } };
  list.onmousemove = e => { const o = e.target.closest("li[role=option]"); if (o) mark(opts().indexOf(o)); };
  list.onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); mark(Math.min(opts().length - 1, hl + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); mark(Math.max(0, hl - 1)); }
    else if (e.key === "Enter" && opts()[hl]) { e.preventDefault(); show(false); btn.focus(); open(opts()[hl].dataset.id); }
    else if (e.key === "Escape" || e.key === "Tab") { show(false); btn.focus(); }
  };
  btn.onkeydown = e => { if (e.key === "ArrowDown") { e.preventDefault(); show(true); } };
  document.addEventListener("click", e => { if (!dd.contains(e.target)) show(false); });
}
function step(d) {
  const i = INDEX.findIndex(r => r.id === CURRENT);
  open(INDEX[(i + d + INDEX.length) % INDEX.length].id);
}
async function open(id) {
  CURRENT = id;
  const i = INDEX.findIndex(r => r.id === id);
  $("#ddN").textContent = no(i); $("#ddT").textContent = INDEX[i].text;
  $("#count").textContent = `${no(i)} / ${String(INDEX.length).padStart(2, "0")}`;
  $$("#ddList li[role=option]").forEach(o => o.setAttribute("aria-selected", o.dataset.id === id));
  history.replaceState(null, "", `?row=${encodeURIComponent(id)}`);
  const j = await (await fetch(`/api/trace/row/${encodeURIComponent(id)}`)).json();
  draw(build(j.trace, j.docker, j.feature_names));
}

/* ---- what each stage computed, from the recorded trace ------------------------------------------------ */
function marked(text, spans) {
  const ok = spans.filter(s => s.start >= 0).sort((a, b) => a.start - b.start);
  let out = "", at = 0;
  for (const s of ok) {
    if (s.start < at) continue;
    out += esc(text.slice(at, s.start)) + `<span class="${s.k}">${esc(text.slice(s.start, s.end))}</span>`;
    at = s.end;
  }
  return out + esc(text.slice(at));
}

function timeline(f, day) {
  const W = 720, H = 230, L = 132, R = 8, T = 22, B = 34;
  const t0 = Date.parse("2025-10-01"), t1 = Date.parse("2026-11-01");
  const X = d => L + (W - L - R) * (Date.parse(d.length === 7 ? d + "-15" : d.length === 4 ? d + "-07-01" : d) - t0) / (t1 - t0);
  const vals = [];  // one lane per distinct value
  [...f.steps.map(s => s.value), ...f.mentions.map(m => m.value), f.value].forEach(v => { if (!vals.includes(val(v))) vals.push(val(v)); });
  const lane = i => T + (H - T - B) * (vals.length === 1 ? 0.5 : i / (vals.length - 1));
  const Y = v => lane(vals.indexOf(val(v)));
  let s = `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of ${esc(f.subject)} ${esc(attr(f.attribute))}">`;
  for (let m = 0; m <= 13; m += 2) {
    const d = new Date(Date.UTC(2025, 9 + m, 1)), x = X(d.toISOString().slice(0, 10));
    s += `<line x1="${x}" y1="${T - 10}" x2="${x}" y2="${H - B + 4}" stroke="rgba(255,255,255,.05)"/>
      <text x="${x}" y="${H - 10}" fill="#5A5E66" font-size="11" font-family="JetBrains Mono, monospace" text-anchor="middle">${d.toLocaleString("en", { month: "short", timeZone: "UTC" })} ${String(d.getUTCFullYear()).slice(2)}</text>`;
  }
  vals.forEach((v, i) => s += `<text x="${L - 16}" y="${lane(i) + 4}" fill="#9A9EA6" font-size="13" font-family="Figtree, sans-serif" text-anchor="end">${esc(cut(v, 18))}</text>`);
  if (f.steps.length) {   // the staircase the truth engine fitted
    let d = "";
    f.steps.forEach((st, i) => {
      const nx = f.steps[i + 1], x0 = X(st.from), x1 = nx ? X(nx.from) : X(st.to) + 4, y = Y(st.value);
      d += i ? ` V${y} H${x1}` : `M${x0},${y} H${x1}`;
    });
    s += `<path d="${d}" fill="none" stroke="#EDEDED" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  f.mentions.filter(m => !m.this).forEach(m => {
    const c = m.anchor >= 1 ? "#7BD88F" : m.anchor <= -1 ? "#FF6B7A" : "rgba(237,237,237,.38)";
    const r = Math.abs(m.anchor) >= 1 ? 4.2 : 2.2 + Math.min(2, m.weight * 2);
    s += `<circle cx="${X(m.date)}" cy="${Y(m.value)}" r="${r}" fill="${c}"/>`;
  });
  const dx = X(day), dy = Y(f.value);
  s += `<line x1="${dx}" y1="${T - 10}" x2="${dx}" y2="${H - B + 4}" stroke="rgba(215,241,59,.35)" stroke-dasharray="2 4"/>
    <circle cx="${dx}" cy="${dy}" r="8" fill="none" stroke="#D7F13B" stroke-width="1.6"/><circle cx="${dx}" cy="${dy}" r="2.5" fill="#D7F13B"/>`;
  return s + "</svg>";
}

function build(t, docker, names) {
  const row = t.row, v = t.verdict, judge = t.judge || {}, att = t.attributor;
  const features = t.features || [], pagef = t.page_features || [];
  const linker = t.linker || [], linkerIn = linker.filter(m => m.in_sentence), linkerPage = linker.filter(m => !m.in_sentence);
  const rd = t.reader || [], facts = (t.truth && t.truth.facts) || [], rec = t.reconcile || [];
  const pinfo = (t.truth && t.truth.page) || {};
  const match = docker && docker.label === v.label;
  const evid = n => { const f = features.find(x => x.name === n); return f ? f.value : null; };
  const unlog = x => x == null ? "–" : Math.round(Math.exp(x) - 1);
  const pf = judge.p_false_given_decided ?? 0, cutoff = judge.cutoff ?? .6, worst = t.truth ? t.truth.worst : "none";
  const pageSize = pinfo.size || (t.page || []).length;
  const real = att ? att.values.filter(a => a.kind !== "boolean" || a.candidates.some(c => c.probability >= 0.01)) : [];
  const quietYesNo = att ? att.values.find(a => a.kind === "boolean" && !real.includes(a)) : null;
  const chosen = att ? att.chosen : [];
  const cls = judge.classes || [], probs = judge.probabilities || [];
  const confNum = v.confidence != null ? v.csv.split(",").pop() : "";
  const bad = facts.find(f => f.status === worst) || facts[0];
  const edge = {
    "input>linker": "1 sentence", "input>reader": "1 sentence",
    "linker>attributor": plural(linker.length, "subject"), "reader>attributor": plural(rd.length, "value"),
    "attributor>kb": plural(att ? chosen.length : facts.length, "fact"), "kb>truth": plural(facts.length, "fact"),
    "truth>judge": `${features.length} numbers`, "input>judge": `the page (${pagef.length || 3} numbers)`, "judge>writer": `${v.label}${confNum ? " " + confNum : ""}`,
  };
  const io = (ids, extraIn, extraOut) => {
    const ins = WIRES.filter(w => ids.includes(w[1]) && !ids.includes(w[0])).map(w => `<b>${esc(edge[`${w[0]}>${w[1]}`])}</b> from ${node(w[0]).name}`);
    const outs = WIRES.filter(w => ids.includes(w[0]) && !ids.includes(w[1])).map(w => `<b>${esc(edge[`${w[0]}>${w[1]}`])}</b> to ${node(w[1]).name}`);
    const uniq = a => [...new Set(a)];
    return `in&nbsp;&nbsp;${uniq([...(extraIn ? [extraIn] : []), ...ins]).join(", ")}<br>out&nbsp;${uniq([...outs, ...(extraOut ? [extraOut] : [])]).join(", ")}`;
  };

  const short = {
    input: `${row.id} · ${row.date}`,
    linker: linkerIn.length ? cut(linkerIn[0].subject, 14) + (linkerIn.length > 1 ? ` +${linkerIn.length - 1}` : "") : "none named",
    reader: rd.length ? cut(val(rd[0].value), 16) + (rd.length > 1 ? ` +${rd.length - 1}` : "") : "no values",
    attributor: !att ? "from the practice data" : chosen.length ? cut(`${attr(chosen[0].attribute)}, score ${chosen[0].score.toFixed(2)}`, 26) : "no fact above threshold",
    kb: rec.length ? plural(rec.length, "correction") : "no correction",
    truth: bad ? cut(`${val(bad.value)}: ${SHORT[bad.status] || bad.status}`, 26) : "no fact",
    judge: v.label === "unsure" ? "unsure" : `P(false) ${pct(pf)} → ${v.label}`,
    writer: `${v.label}${confNum ? " " + confNum : ""}`,
  };

  const S = [];
  // 01 Input
  S.push({ title: "Input", lede: "The sentence and the page it was published on. Sentences on one page are judged together, because lies cluster.",
    io: io(["input"], `<b>row ${esc(row.id)}</b> of universe.csv`),
    html: `<ul class="rows">${(t.page || []).map(p => `<li class="${p.self ? "me" : ""}"><span>${esc(p.text)}</span>
        <em>${p.self ? "this sentence" : p.label ? lab(p.label) : "to label"}</em></li>`).join("")}</ul>
      <p class="text">${plural(pageSize, "sentence")} on this page${pinfo.trust_loo != null ? ` · trust of the rest of the page <b>${(+pinfo.trust_loo).toFixed(2)}</b>` : ""}${pinfo.true_labels != null
        ? ` · labelled in the input: ${pinfo.true_labels} true, ${pinfo.false_labels} false, ${pinfo.unsure_labels} unsure` : ""}</p>` });
  // 02 Linker and reader
  const spans = [...linkerIn.map(m => ({ ...m, k: "s" })), ...rd.map(r => ({ ...r, k: "v" }))];
  S.push({ title: "Linker and Reader", lede: "Two readers go over the sentence side by side. The linker finds who it is about, from Hooly's own list of names. The reader reads every value exactly as the organisers' published rules do.",
    io: io(["linker", "reader"]),
    html: `<p class="quote">${marked(row.text, spans)}</p>
      <div class="cols">
        <div><h3>Who <span class="low">· linker</span></h3>${linkerIn.length ? linkerIn.map(m => `<div class="item"><span class="k">${esc(m.subject)}</span><span class="d">written “${esc(m.written)}”</span></div>`).join("")
          : '<div class="item"><span class="mid">No subject named in the sentence.</span></div>'}
          ${linkerPage.length ? `<p class="text">Also named on the page: ${linkerPage.map(m => `${esc(m.subject)} <span class="low">(${plural(m.row_gap, "sentence")} away)</span>`).join(", ")}</p>` : ""}</div>
        <div><h3>Values <span class="low">· reader</span></h3>${rd.length ? rd.map(r => `<div class="item"><span class="k">“${esc(r.text)}” → ${esc(val(r.value))}</span>${r.negated ? ' <span class="lab false">negated, ignored</span>' : ""}
            <span class="d">${esc(JSON.stringify(r.value))}${r.alts && r.alts.length ? `<br>also possible: ${r.alts.map(a => esc(val(a))).join(", ")}` : ""}</span></div>`).join("")
          : '<div class="item"><span class="mid">No number, date or price. Yes/no facts and names are found by the attributor.</span></div>'}</div>
      </div>` });
  // 03 Attributor
  S.push({ title: "Attributor", lede: `A model trained on 2,400 labelled facts gives every fact a value could belong to a probability. The deciding score tempers that probability by close rivals, and the best score is kept if it is above ${att ? att.threshold : "the threshold"}.`,
    io: io(["attributor"]),
    html: att ? real.map(a => {
        const top = a.candidates[0], ties = a.candidates.filter(c => c.probability === top.probability).length;
        return `<h3>“${esc(a.text)}” <span class="low">· ${a.considered} candidate facts scored</span></h3>
        <table><thead><tr><th>Candidate fact</th><th></th><th class="n">Probability</th><th class="n">Score</th></tr></thead><tbody>
        ${a.candidates.map(c => {
          const won = chosen.some(ch => ch.subject === c.subject && ch.attribute === c.attribute && same(ch.value, c.value));
          return `<tr class="${won ? "win" : ""}"><td>${fact(c)}${c.value.kind === "boolean" ? ` = ${val(c.value)}` : ""}</td>
            <td class="b"><span class="bar2"><i style="width:${Math.max(1, c.probability * 100)}%"></i></span></td>
            <td class="n">${(c.probability * 100).toFixed(1)}%</td><td class="n">${c.score.toFixed(3)}</td></tr>`; }).join("")}</tbody></table>
        ${ties > 1 ? `<p class="text">${ties} candidates tie at ${(top.probability * 100).toFixed(1)}%: the model cannot tell them apart, so the first one listed is kept. The knowledge base gets a chance to correct it next.</p>` : ""}`; }).join("")
        + (quietYesNo ? `<p class="text">Read as a yes/no statement, ${quietYesNo.considered} yes/no facts were checked; none scored above 1%.</p>` : "")
      : '<p class="text">This sentence is labelled in the input, so its facts come straight from the practice data.</p>' });
  // 04 Knowledge base
  S.push({ title: "Knowledge base", lede: "Checks the attributor against what is already known. A value that matches exactly what one fact of a subject on the page holds on this date is almost surely that fact. Lies never match, so this only rescues true sentences from an extraction slip.",
    io: io(["kb"]),
    html: (rec.length ? `<p class="text" style="margin-top:0">Corrected: ${rec.map(n => n.was ? `${fact(n.was)} → <b>${fact(n.now)}</b>` : `added <b>${fact(n.now)} = ${esc(val(n.now.value))}</b>`).join("; ")}, because the value matches exactly what that fact holds on this date.</p>`
        : `<p class="text" style="margin-top:0">No exact match disagrees with the attributor, so its choice stands.</p>`)
      + `<h3>Facts sent to the truth engine</h3>${facts.length ? facts.map(f => `<div class="item"><span class="k">${fact(f)} = ${esc(val(f.value))}</span></div>`).join("")
        : '<div class="item"><span class="mid">None: the sentence states no fact the engine could find.</span></div>'}` });
  // 05 Truth engine
  S.push({ title: "Truth engine", lede: "Every other sentence that mentions the same fact lands on its timeline. The engine fits the most likely staircase: a lone wrong value is outvoted, and a real change repeated by later pages becomes a new step.",
    io: io(["truth"]),
    html: facts.length ? facts.map(f => `<h3>${fact(f)}<span class="st ${f.status}">${esc(SHORT[f.status] || f.status)}</span></h3>
        ${timeline(f, row.date)}
        <div class="legend"><i>— fitted timeline</i><i style="color:#7BD88F">● labelled true</i><i style="color:#FF6B7A">● labelled false</i><i>● other sentences</i><i style="color:#D7F13B">◎ this sentence</i></div>
        <p class="text">This sentence says <b>${esc(val(f.value))}</b> on ${esc(row.date)}${f.held_on_date ? `; the timeline holds <b>${esc(val(f.held_on_date))}</b> on that date` : ""}.
          The value ${STATUS[f.status] || f.status}. <span class="low">${plural(f.mention_count, "mention")} of this fact · this page's trust ${f.page_trust}</span></p>`).join("")
      : '<p class="text" style="margin-top:0">No fact to place on a timeline: the judge decides from the page and the wording alone.</p>' });
  // 06 Judge
  const lines = [
    ["Worst fact's status", STATUS[worst] || "–"],
    ["Other mentions of that fact", unlog(evid("other mentions of the worst fact (log)"))],
    ["…with the same value within 30 days", unlog(evid("mentions with the same value within 30 days (log)"))],
    ["…with a different value within 30 days", unlog(evid("mentions with a different value within 30 days (log)"))],
    ["Confirmed-true rows with the same value", evid("confirmed-true rows with the same value")],
    ["Confirmed-true rows nearby with another value", evid("confirmed-true rows nearby with a different value")],
    ["Newer values since this one was last seen", evid("newer values since this one was last seen (weight)")],
    ["Trust of the rest of the page", evid("trust of the rest of the page")],
    ["Hedging words (“I have been told”)", evid("hedging words (\"I have been told\")") ? "yes" : "no"],
    ["Speaker is Gavin", evid("the speaker is Gavin") ? "yes" : "no"],
    ["Sentences on this page the first pass called false", !pagef.length ? "–" : pagef[1] < 0 ? "no others" : `${pagef[2]} (highest ${pct(pagef[1])})`],
  ];
  S.push({ title: "Judge", lede: `A forest of decision trees, trained on the labelled rows, reads ${names.length} numbers about this sentence and gives the odds of true, false and unsure.`,
    io: io(["judge"]),
    html: `<div class="meter" style="--p:${pf};--c:${cutoff}"><span class="m-end">← true</span><span class="m-end r">false →</span>
        <div class="m-track"></div><div class="m-cut"><span>${pct(cutoff)}</span></div><div class="m-dot"><span>${(pf * 100).toFixed(1)}%</span></div></div>
      <p class="rule">${v.label === "unsure" ? `Unsure is the most likely of the three, so the answer is ${lab("unsure")}.`
        : `P(false) <span class="mono">${(pf * 100).toFixed(1)}%</span> ${pf > cutoff ? "is above" : "is not above"} the <span class="mono">${pct(cutoff)}</span> cutoff, so ${lab(v.label)}, ${pct(v.confidence)} sure.`}</p>
      <p class="probs">${["true", "false", "unsure"].map(c => { const j = cls.indexOf(c); return `<span>${lab(c)} ${((j >= 0 ? probs[j] : 0) * 100).toFixed(1)}%</span>`; }).join("")}</p>
      <h3>The evidence that weighs most</h3>
      <dl class="ev">${lines.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b ?? "–")}</dd>`).join("")}</dl>
      <p class="text">${esc(v.why)}.${judge.self_training ? ` In a first pass this sentence scored P(false) ${pct(judge.first_pass_p_false)}; the confident verdicts of other sentences were then added to the timelines as weak evidence, and everything was judged again.` : ""}</p>
      <details><summary>All ${names.length} numbers the trees read</summary>
        <dl class="ev">${[...features, ...pagef.map((x, i) => ({ name: names[features.length + i], value: x }))].map(f => `<dt>${esc(f.name)}</dt><dd>${esc(f.value)}</dd>`).join("")}</dl></details>` });
  // 07 Writer
  S.push({ title: "Writer", lede: "The line this sentence gets in output.csv: its id, four empty claim columns, the label and the confidence.",
    io: io(["writer"], "", "<b>1 line</b> to output.csv"),
    html: `<pre class="csv"><span class="h">id,type,text,form,label,confidence</span>\n${esc(v.csv)}</pre>
      ${docker ? `<p class="text">The Docker container wrote <b>${esc(docker.label)}${docker.confidence != null ? " " + Number(docker.confidence).toFixed(3) : ""}</b> for this sentence:
        ${match ? '<span class="same">the same label.</span>' : '<span class="diff">a different label.</span>'}</p>
        ${docker.truth ? `<p class="text">Its hidden practice label is ${lab(docker.truth)}, so the verdict is ${docker.truth === docker.label ? "<b>correct</b>" : '<span class="diff">wrong</span>'}.</p>` : ""}` : ""}
      <p class="foot">Every number on this page was recorded from the engine running in-process on the same input as the Docker container. Recording changes no verdict${TRACE ? `: ${TRACE.same_label} of ${TRACE.traced} traced sentences got the same label as the container` : ""}.</p>` });
  return { row, short, S };
}

/* ---- drawing ------------------------------------------------------------------------------------ */
function wire(w) {
  const a = node(w[0]), b = node(w[1]);
  if (w[4] === "page") {  // the page goes straight to the judge, down the left side
    const xl = 34;
    return `M${a.x},${a.y} C${a.x - 90},${a.y} ${xl},${a.y + 14} ${xl},${a.y + 74} L${xl},${b.y - 74} C${xl},${b.y - 14} ${b.x - 90},${b.y} ${b.x},${b.y}`;
  }
  if (a.x === b.x) return `M${a.x},${a.y} L${b.x},${b.y}`;
  const m = (b.y - a.y) / 2;
  return `M${a.x},${a.y} C${a.x},${a.y + m} ${b.x},${b.y - m} ${b.x},${b.y}`;
}

function pipeline(D) {
  let s = `<svg viewBox="-10 0 ${VW + 10} ${VH}" preserveAspectRatio="xMidYMid meet" aria-label="The pipeline">`;
  WIRES.forEach((w, i) => s += `<path class="base" d="${wire(w)}"/>`);
  WIRES.forEach((w, i) => s += `<path class="trace" id="w${i}" pathLength="1" d="${wire(w)}"/>`);
  s += `<text class="wl" transform="translate(24 ${(node("input").y + node("judge").y) / 2}) rotate(-90)" text-anchor="middle">the page</text>`;
  WIRES.forEach((w, i) => s += `<circle class="head" id="h${i}" r="3.5"/>`);
  for (const n of NODES) {
    const left = n.side === "left", tx = left ? n.x - 22 : n.x + 24, anchor = left ? "end" : "start";
    s += `<g class="nd" id="n-${n.id}" data-step="${n.step}" role="button" tabindex="0" aria-label="${n.name}">
      <circle class="ring" cx="${n.x}" cy="${n.y}" r="14"/><circle class="dot" cx="${n.x}" cy="${n.y}" r="6.5"/>
      <rect x="${left ? tx - 150 : n.x - 10}" y="${n.y - 22}" width="${left ? 172 : 230}" height="48" fill="transparent"/>
      <text class="nm" x="${tx}" y="${n.y + 1}" text-anchor="${anchor}">${n.name}</text>
      <text class="sm" x="${tx}" y="${n.y + 21}" text-anchor="${anchor}">${esc(D.short[n.id])}</text></g>`;
  }
  return s + "</svg>";
}

function draw(D) {
  $("#main").innerHTML = `<div class="grid">
    <aside class="pipe" id="pipe">${pipeline(D)}</aside>
    <div class="story">
      <div class="mbar"><span id="mlabel">Scroll to begin</span><i><b id="mfill"></b></i></div>
      <section class="intro"><div class="meta">${esc(D.row.id)} · page dated ${esc(D.row.date)}</div>
        <h1>${esc(D.row.text)}</h1><p class="hint">Scroll to follow it through the pipeline</p></section>
      ${D.S.map((s, i) => `<section class="step" id="s${i}" data-step="${i}">
        <div class="no">${String(i + 1).padStart(2, "0")} / ${String(STEPS).padStart(2, "0")}</div>
        <h2>${s.title}</h2><p class="lede">${s.lede}</p><p class="io">${s.io}</p>${s.html}</section>`).join("")}
    </div></div>`;
  $$(".nd").forEach(g => {
    const go = () => { const sec = $(`#s${g.dataset.step}`); scrollTo({ top: scrollY + sec.getBoundingClientRect().top - innerHeight * .4 + 2, behavior: "smooth" }); };
    g.onclick = go; g.onkeydown = e => { if (e.key === "Enter") go(); };
  });
  scrollTo(0, 0);
  update();
}

/* ---- the one animation: the line traces the pipeline as you scroll ------------------------------------ */
function update() {
  const secs = $$(".step"); if (!secs.length) return;
  const line = innerHeight * .6;
  const tops = secs.map(el => el.getBoundingClientRect().top - line);
  // progress: i when step i's top reaches the line, rising to i + 1 as the next one does
  let p = -1;
  tops.forEach((t, i) => { if (t <= 0) p = i + (i + 1 < tops.length ? Math.min(1, -t / (tops[i + 1] - t)) : 0); });
  P = p;
  WIRES.forEach((w, i) => {
    const t = Math.min(1, Math.max(0, (p - w[2]) / (w[3] - w[2])));
    const path = $(`#w${i}`), head = $(`#h${i}`);
    if (!path) return;
    path.style.strokeDashoffset = 1 - t;
    const moving = t > 0 && t < 1;
    head.style.opacity = moving ? 1 : 0;
    if (moving) { const pt = path.getPointAtLength(path.getTotalLength() * t); head.setAttribute("cx", pt.x); head.setAttribute("cy", pt.y); }
  });
  const now = Math.floor(p);
  $$(".nd").forEach(g => { const s = +g.dataset.step; g.classList.toggle("reached", p >= s); g.classList.toggle("current", p >= 0 && now === s); });
  secs.forEach((el, i) => el.classList.toggle("on", i === now));
  const m = $("#mlabel");
  if (m) {
    m.textContent = p < 0 ? "Scroll to begin" : `${String(now + 1).padStart(2, "0")} / ${String(STEPS).padStart(2, "0")} · ${secs[now].querySelector("h2").textContent}`;
    $("#mfill").style.width = `${Math.max(0, p) / (STEPS - 1) * 100}%`;
  }
}
addEventListener("scroll", update, { passive: true });
addEventListener("resize", update);

loadIndex();
</script>
